---
# role: forgejo
# file: tasks/install.yml

- name: FORGEJO | Resolve the latest stable release
  ansible.builtin.uri:
    url: https://data.forgejo.org/api/v1/repos/forgejo/forgejo/releases/latest
    return_content: true
    timeout: 30
  register: __forgejo_release
  check_mode: false
  when: forgejo_version == 'latest'

- name: FORGEJO | Validate the resolved release tag
  ansible.builtin.assert:
    that:
      - __forgejo_version is match('^[0-9]+\.[0-9]+\.[0-9]+\Z')
    quiet: true
    fail_msg: The release must have a stable numeric major.minor.patch version.

- name: FORGEJO | Create the versioned binary directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /usr/local/libexec/forgejo
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: FORGEJO | Download the verified Linux amd64 binary
  become: true
  become_user: root
  ansible.builtin.get_url:
    url: "{{ __forgejo_download_url }}"
    checksum: "sha256:{{ __forgejo_download_url }}.sha256"
    dest: "/usr/local/libexec/forgejo/forgejo-v{{ __forgejo_version }}"
    owner: root
    group: root
    mode: '0755'
    timeout: 120
  notify: restart forgejo

- name: FORGEJO | Create the executable directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: FORGEJO | Select the active binary
  become: true
  become_user: root
  ansible.builtin.file:
    src: "/usr/local/libexec/forgejo/forgejo-v{{ __forgejo_version }}"
    dest: /usr/local/bin/forgejo
    state: link
    owner: root
    group: root
  notify: restart forgejo
