---
# role: forgejo
# file: tasks/assert.yml

- name: FORGEJO | Require Linux amd64 with systemd
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.service_mgr == 'systemd'
      - forgejo_version == 'latest' or forgejo_version is match('^[0-9]+\.[0-9]+\.[0-9]+\Z')
    quiet: true

- name: FORGEJO | Validate section structure
  ansible.builtin.assert:
    that:
      - __forgejo_section.key is match('^[A-Za-z0-9_.-]+$')
      - __forgejo_section.value is mapping
    quiet: true
  loop: '{{ __forgejo_config | dict2items }}'
  loop_control:
    loop_var: __forgejo_section
    label: '{{ __forgejo_section.key }}'
  no_log: true

- name: FORGEJO | Keep managed paths and credentials authoritative
  ansible.builtin.assert:
    that:
      - __forgejo_config.get(__forgejo_section.key, {}).keys() | intersect(__forgejo_section.value) | length == 0
    quiet: true
    fail_msg: Configure database inputs through forgejo_database_ variables; managed paths and instance secrets are fixed.
  loop: '{{ __forgejo_reserved_config | dict2items }}'
  loop_control:
    loop_var: __forgejo_section
    label: '{{ __forgejo_section.key }}'

- name: FORGEJO | Validate configuration values
  ansible.builtin.assert:
    that:
      - __forgejo_setting.key is match('^[A-Za-z0-9_.-]+$')
      - __forgejo_setting.value is string or __forgejo_setting.value is number or __forgejo_setting.value is boolean
      - "'\n' not in (__forgejo_setting.value | string)"
      - "'\r' not in (__forgejo_setting.value | string)"
      - "'\"\"\"' not in (__forgejo_setting.value | string)"
    quiet: true
  loop: >-
    {{ __forgejo_config | combine(__forgejo_managed_config, recursive=true)
       | dict2items | map(attribute='value') | map('dict2items') | flatten }}
  loop_control:
    loop_var: __forgejo_setting
    label: '{{ __forgejo_setting.key }}'
  no_log: true

- name: FORGEJO | Validate listener endpoints
  ansible.builtin.assert:
    that:
      - __forgejo_config.server.PROTOCOL in ['http', 'http+unix']
      - __forgejo_config.server.PROTOCOL != 'http+unix' or __forgejo_config.server.HTTP_ADDR == '/run/forgejo/forgejo.sock'
      - __forgejo_config.server.ROOT_URL is match('^https?://')
    quiet: true
  no_log: true

- name: FORGEJO | Require credentials for external databases
  ansible.builtin.assert:
    that:
      - forgejo_database_password is defined
    fail_msg: Set forgejo_database_password for PostgreSQL or MySQL/MariaDB; SQLite needs no credential.
    quiet: true
  when: forgejo_database_type != 'sqlite3'

- name: FORGEJO | Validate external database settings
  ansible.builtin.assert:
    that:
      - forgejo_database_host is match('^(/[^\s:]+|[^\s/:]+:[0-9]+)\Z')
      - forgejo_database_password == forgejo_database_password | trim
      - forgejo_database_name | length > 0
      - forgejo_database_user | length > 0
    quiet: true
  no_log: true
  when: forgejo_database_type != 'sqlite3'
