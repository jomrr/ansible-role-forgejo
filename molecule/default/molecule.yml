---
# role: forgejo
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
    connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        ansible_podman_mount_detection: false
      forgejo_servers:
        forgejo_database_host: "forgejo-${MOLECULE_SCENARIO_NAME}-db:5432"
        forgejo_database_name: "{{ inventory_hostname | replace('-', '_') }}"
        forgejo_database_password: "molecule-database-password"
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "verify"
    - "destroy"
  name: "default"
platforms:
  - name: "forgejo-${MOLECULE_SCENARIO_NAME}"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-postgres:/run/postgresql:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-valkey:/run/valkey:rw"
  - name: "forgejo-${MOLECULE_SCENARIO_NAME}-db"
    image: "docker.io/library/postgres:16-alpine"
    pre_build_image: true
    override_command: false
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_dependencies"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-postgres:/var/run/postgresql:rw"
    env:
      POSTGRES_USER: "forgejo"
      POSTGRES_PASSWORD: "molecule-database-password"
      POSTGRES_DB: "postgres"
  - name: "forgejo-${MOLECULE_SCENARIO_NAME}-cache"
    image: "docker.io/valkey/valkey:8-alpine"
    pre_build_image: true
    override_command: true
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_dependencies"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-valkey:/run/valkey:rw"
    command: "valkey-server --port 0 --unixsocket /run/valkey/valkey.sock --unixsocketperm 777"
