---
# role: forgejo
# file: molecule/resources/playbooks/prepare_dev.yml


- name: FORGEJO | Prepare external database and cache fixtures
  hosts: localhost
  gather_facts: false
  tasks:
    - name: FORGEJO | Wait for the Valkey Unix socket
      containers.podman.podman_container_exec:
        name: "forgejo-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-cache"
        argv: [valkey-cli, -s, /run/valkey/valkey.sock, ping]
      register: __forgejo_cache_ready
      until: __forgejo_cache_ready.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: FORGEJO | Wait for PostgreSQL
      containers.podman.podman_container_exec:
        name: "forgejo-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-db"
        argv: [pg_isready, -U, forgejo, -d, postgres]
      register: __forgejo_database_ready
      until: __forgejo_database_ready.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: FORGEJO | Create a PostgreSQL database for each platform
      containers.podman.podman_container_exec:
        name: "forgejo-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-db"
        argv:
          - psql
          - -U
          - forgejo
          - -d
          - postgres
          - -c
          - 'CREATE DATABASE {{ __forgejo_host | replace("-", "_") }}'
      loop: '{{ groups.forgejo_servers }}'
      loop_control:
        loop_var: __forgejo_host

    - name: FORGEJO | Wait for MariaDB
      containers.podman.podman_container_exec:
        name: "forgejo-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-mysql"
        argv: [healthcheck.sh, --connect, --innodb_initialized]
      register: __forgejo_mysql_ready
      until: __forgejo_mysql_ready.rc == 0
      retries: 60
      delay: 2
      changed_when: false

    - name: FORGEJO | Create MariaDB databases and grant access
      containers.podman.podman_container_exec:
        name: "forgejo-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-mysql"
        argv:
          - mariadb
          - -uroot
          - -pmolecule-root-password
          - -e
          - >-
            CREATE DATABASE {{ __forgejo_host | replace("-", "_") }} CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
            GRANT ALL ON {{ __forgejo_host | replace("-", "_") }}.* TO 'forgejo'@'%';
      loop: '{{ groups.forgejo_servers }}'
      loop_control:
        loop_var: __forgejo_host

- name: FORGEJO | Prepare managed hosts
  ansible.builtin.import_playbook: prepare.yml
