---
# role: forgejo
# file: molecule/resources/playbooks/prepare.yml


- name: FORGEJO | Prepare PostgreSQL fixture
  hosts: localhost
  gather_facts: false
  tasks:
    - name: FORGEJO | Wait for the Valkey Unix socket
      containers.podman.podman_container_exec:
        name: "forgejo-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-cache"
        argv: [valkey-cli, -s, /run/valkey/valkey.sock, ping]
      register: __forgejo_cache_ready
      until: __forgejo_cache_ready.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: FORGEJO | Wait for PostgreSQL
      containers.podman.podman_container_exec:
        name: "forgejo-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-db"
        argv: [pg_isready, -U, forgejo, -d, postgres]
      register: __forgejo_database_ready
      until: __forgejo_database_ready.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: FORGEJO | Create a database for each platform
      containers.podman.podman_container_exec:
        name: "forgejo-{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}-db"
        argv:
          - psql
          - -U
          - forgejo
          - -d
          - postgres
          - -c
          - 'CREATE DATABASE {{ __forgejo_host | replace("-", "_") }}'
      loop: '{{ groups.forgejo_servers }}'
      loop_control:
        loop_var: __forgejo_host

- name: FORGEJO | Prepare managed hosts
  hosts: forgejo_servers
  gather_facts: true
  tasks:
    - name: FORGEJO | Refresh APT metadata
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.pkg_mgr == 'apt'

    - name: FORGEJO | Create the historical release directory
      become: true
      become_user: root
      ansible.builtin.file:
        path: /usr/local/libexec/forgejo
        state: directory
        mode: '0755'

    - name: FORGEJO | Seed a retained historical release
      become: true
      become_user: root
      ansible.builtin.copy:
        content: historical-release-fixture
        dest: /usr/local/libexec/forgejo/forgejo-v0.0.0
        mode: '0755'

    - name: FORGEJO | Create the adoption fixture directory
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/forgejo
        state: directory
        mode: '0750'
      when: ansible_facts.os_family == 'RedHat'

    - name: FORGEJO | Seed a referenced installation secret
      become: true
      become_user: root
      ansible.builtin.copy:
        content: molecule-existing-installation-secret
        dest: /etc/forgejo/previous-secret
        mode: '0600'
      when: ansible_facts.os_family == 'RedHat'

    - name: FORGEJO | Seed inline and referenced secrets with repeated sections
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/forgejo/app.ini
        mode: '0600'
        content: |
          APP_NAME = Previous Forgejo
          [security]
          SECRET_KEY_URI = file:/etc/forgejo/previous-secret
          [server]
          LFS_JWT_SECRET = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          [oauth2]
          ENABLED = false
          JWT_SECRET = BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          [repository.signing]
          DEFAULT_TRUST_MODEL = collaborator
          [repository.signing]
          DEFAULT_TRUST_MODEL = committer
      when: ansible_facts.os_family == 'RedHat'
