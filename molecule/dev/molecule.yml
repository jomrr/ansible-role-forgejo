---
# role: forgejo
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        ansible_podman_mount_detection: false
      forgejo_servers:
        forgejo_database_name: "{{ inventory_hostname | replace('-', '_') }}"
    host_vars:
      almalinux-latest-forgejo:
        forgejo_database_host: "forgejo-${MOLECULE_SCENARIO_NAME}-db:5432"
        forgejo_database_password: "molecule-database-password"
      debian-latest-forgejo:
        forgejo_database_host: "/run/postgresql"
        forgejo_database_password: "molecule-database-password"
        forgejo_config:
          server:
            PROTOCOL: "http+unix"
            HTTP_ADDR: "/run/forgejo/forgejo.sock"
          cache:
            ADAPTER: "redis"
            HOST: "network=unix,addr=/run/valkey/valkey.sock,db=2,pool_size=50,idle_timeout=180"
      fedora-latest-forgejo:
        forgejo_database_type: "sqlite3"
      opensuse-leap-latest-forgejo:
        forgejo_database_type: "mysql"
        forgejo_database_host: "forgejo-${MOLECULE_SCENARIO_NAME}-mysql:3306"
        forgejo_database_password: "molecule-database-password"
      opensuse-tumbleweed-latest-forgejo:
        forgejo_database_type: "mysql"
        forgejo_database_host: "/run/mysqld/mysqld.sock"
        forgejo_database_password: "molecule-database-password"
      ubuntu-latest-forgejo:
        forgejo_database_type: "sqlite3"
        forgejo_config:
          server:
            PROTOCOL: "http+unix"
            HTTP_ADDR: "/run/forgejo/forgejo.sock"
          cache:
            ADAPTER: "redis"
            HOST: "network=unix,addr=/run/valkey/valkey.sock,db=2,pool_size=50,idle_timeout=180"
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare_dev.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "verify"
    - "destroy"
  name: "dev"
platforms:
  - name: "almalinux-latest-forgejo"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-postgres:/run/postgresql:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-valkey:/run/valkey:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-mysql:/run/mysqld:rw"
  - name: "debian-latest-forgejo"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-postgres:/run/postgresql:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-valkey:/run/valkey:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-mysql:/run/mysqld:rw"
  - name: "fedora-latest-forgejo"
    image: "docker.io/jomrr/molecule-fedora:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-postgres:/run/postgresql:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-valkey:/run/valkey:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-mysql:/run/mysqld:rw"
  - name: "opensuse-leap-latest-forgejo"
    image: "docker.io/jomrr/molecule-opensuse-leap:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-postgres:/run/postgresql:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-valkey:/run/valkey:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-mysql:/run/mysqld:rw"
  - name: "opensuse-tumbleweed-latest-forgejo"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-postgres:/run/postgresql:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-valkey:/run/valkey:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-mysql:/run/mysqld:rw"
  - name: "ubuntu-latest-forgejo"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-postgres:/run/postgresql:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-valkey:/run/valkey:rw"
      - "forgejo-${MOLECULE_SCENARIO_NAME}-mysql:/run/mysqld:rw"
  - name: "forgejo-${MOLECULE_SCENARIO_NAME}-db"
    image: "docker.io/library/postgres:16-alpine"
    pre_build_image: true
    override_command: false
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_dependencies"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-postgres:/var/run/postgresql:rw"
    env:
      POSTGRES_USER: "forgejo"
      POSTGRES_PASSWORD: "molecule-database-password"
      POSTGRES_DB: "postgres"
  - name: "forgejo-${MOLECULE_SCENARIO_NAME}-cache"
    image: "docker.io/valkey/valkey:8-alpine"
    pre_build_image: true
    override_command: true
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_dependencies"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-valkey:/run/valkey:rw"
    command: "valkey-server --port 0 --unixsocket /run/valkey/valkey.sock --unixsocketperm 777"
  - name: "forgejo-${MOLECULE_SCENARIO_NAME}-mysql"
    image: "docker.io/library/mariadb:11.4"
    pre_build_image: true
    override_command: false
    network: "forgejo-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "forgejo_dependencies"
    volumes:
      - "forgejo-${MOLECULE_SCENARIO_NAME}-mysql:/run/mysqld:rw"
    env:
      MARIADB_ROOT_PASSWORD: "molecule-root-password"
      MARIADB_USER: "forgejo"
      MARIADB_PASSWORD: "molecule-database-password"
      MARIADB_DATABASE: "forgejo"
