---
# role: forgejo
# file: handlers/main.yml

- name: FORGEJO | Reload systemd units
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: reload systemd

- name: FORGEJO | Restart Forgejo
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: forgejo.service
    state: restarted
  listen: restart forgejo
